name: Export

on:
  workflow_dispatch:
    inputs:
      release:
        description: Star Technology release tag, or latest
        type: string
        default: latest
      publish_release:
        description: Publish successful export as a permanent GitHub Release asset
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  export:
    name: Export
    outputs:
      provenance: ${{ steps.package.outputs.provenance }}
      diagnostics-url: ${{ steps.diagnostics.outputs.artifact-url }}
    runs-on: ubuntu-24.04

    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore StarT Exporter
        id: exporter-cache
        uses: actions/cache/restore@v6
        with:
          path: exporter-mod/build/libs/
          key: exporter-jar-v1-${{ runner.os }}-java21-${{ hashFiles('exporter-mod/src/**', 'exporter-mod/*.gradle*', 'exporter-mod/gradle.properties', 'exporter-mod/gradle/**', 'exporter-mod/gradlew*') }}

      - name: Setup installer Java
        id: installer-java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: ${{ steps.exporter-cache.outputs.cache-hit != 'true' && 'gradle' || '' }}
          cache-dependency-path: |
            exporter-mod/*.gradle*
            exporter-mod/gradle.properties
            exporter-mod/**/gradle-wrapper.properties

      - name: Build StarT Exporter
        if: steps.exporter-cache.outputs.cache-hit != 'true'
        working-directory: exporter-mod
        run: bash gradlew --no-daemon build

      - name: Cache StarT Exporter
        if: steps.exporter-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: exporter-mod/build/libs/
          key: ${{ steps.exporter-cache.outputs.cache-primary-key }}

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          node-version-file: .node-version
          cache: true
          require-lockfile: true

      - name: Typecheck
        run: pnpm typecheck

      - name: Setup display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth x11-xserver-utils libgl1-mesa-dri libglx-mesa0 libasound2t64

      - name: Prepare pack
        env:
          PACK_RELEASE: ${{ inputs.release }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm prepare-pack

      - name: Prepare world
        run: pnpm prepare-world

      - name: Install StarT Exporter
        shell: bash
        run: |
          mapfile -t jars < <(find exporter-mod/build/libs -maxdepth 1 -type f -name 'start-exporter-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar')
          if (( ${#jars[@]} != 1 )); then
            printf 'Expected one exporter mod JAR, found %s\n' "${#jars[@]}" >&2
            exit 1
          fi
          cp "${jars[0]}" run/mods/start-exporter.jar

      - name: Run client
        env:
          FORGE_JAVA: ${{ steps.installer-java.outputs.path }}/bin/java
          LIBGL_ALWAYS_SOFTWARE: "true"
          JAVA_TOOL_OPTIONS: -Dstartexport.enabled=true -Dstartexport.quit=true -Dstartexport.output=export -Dstartexport.renderbatchdurationms=4000
        run: bash scripts/diagnose-client.sh

      - name: Package export
        id: package
        run: |
          pnpm package-export
          echo "provenance=$(jq -c '.' .cache/provenance.json)" >> "$GITHUB_OUTPUT"

      - name: Upload export
        uses: actions/upload-artifact@v7
        with:
          name: export-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        id: diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/provenance.json
            .cache/client-console.log
            .cache/thread-dumps/
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish
    needs: export
    if: inputs.publish_release

    runs-on: ubuntu-24.04
    concurrency:
      group: publish-${{ fromJSON(needs.export.outputs.provenance).release.tag }}
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: export-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          PROVENANCE: ${{ needs.export.outputs.provenance }}
          DEBUG_LOGS_URL: ${{ needs.export.outputs.diagnostics-url }}
        run: |
          tag=$(jq -r '.release.tag' <<< "$PROVENANCE")
          title="$(jq -r '.release.name' <<< "$PROVENANCE") Dump"
          notes="$RUNNER_TEMP/release-notes.md"
          test -n "$DEBUG_LOGS_URL"
          jq -r --arg logs "$DEBUG_LOGS_URL" \
            '"Data dump for [\(.release.name)](\(.release.url)).\n\nMinecraft: `\(.minecraft)` · Forge: `\(.forge)`\n\n[Debug logs](\($logs))"' \
            <<< "$PROVENANCE" > "$notes"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/export.zip dist/SHA256SUMS --clobber
            gh release edit "$tag" --title "$title" --notes-file "$notes"
          else
            gh release create "$tag" dist/export.zip dist/SHA256SUMS \
              --target "$SOURCE_SHA" --title "$title" --notes-file "$notes"
          fi
